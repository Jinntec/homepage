[build]
  publish = "public"
  command = "curl -sLJO https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz && tar -xf dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz && rm dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz && export PATH=$PWD/dart-sass:$PATH && hugo --minify --gc"
  
[build.environment]
  HUGO_VERSION = "0.168.0"
  NODE_VERSION = "22"
  DART_SASS_VERSION = "1.105.2"
  HUGO_BASEURL = ""


[headers.values]
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
  Referrer-Policy = "same-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
